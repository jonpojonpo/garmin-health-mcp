[project]
name = "garmin-health-mcp"
version = "0.1.0"
description = "MCP server for Garmin's Personal API: sleep, HRV, Body Battery, stress, training load, readiness, charts and dashboards"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "jonpo" }]
keywords = ["mcp", "garmin", "hrv", "sleep", "training-load", "claude"]
dependencies = ["mcp>=1.20,<2", "httpx>=0.27", "matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/jonpojonpo/garmin-health-mcp"

[project.scripts]
garmin-health-mcp = "garmin_health_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_health_mcp"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
